name: korra10
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: korra
      POSTGRES_USER: korra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.ps1 to create .env first}
    volumes:
      - student_data:/var/lib/postgresql/data
      - ./schema/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korra -d korra"]
      interval: 3s
      timeout: 3s
      retries: 30
  korra:
    image: korra-project10
    build: .
    env_file: .env
    environment:
      DB_BACKEND: postgres
      POSTGRES_HOST: db
      POSTGRES_DB: korra
      POSTGRES_USER: korra
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:2025:2024"
    volumes:
      - ./evidence:/app/evidence
volumes:
  student_data:
