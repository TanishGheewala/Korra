version: '3.8'

services:
  korra:
    # Build from local Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    image: korra-phase-01
    # Container name
    container_name: korra-phase-01
    
    # Load environment variables from .env file
    env_file:
      - .env
    
    # Interactive terminal mode for chatbot
    stdin_open: true
    tty: true
    
    # Mount volume for persistent graph output
    volumes:
      - ./output:/app/output
    
    # Restart policy
    restart: unless-stopped
