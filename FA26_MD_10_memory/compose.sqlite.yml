name: korra10-sqlite
services:
  korra:
    image: korra-project10
    build: .
    env_file: .env
    environment:
      DB_BACKEND: sqlite
      STUDENT_DB_PATH: /app/data/test_database.db
    ports:
      - "127.0.0.1:2025:2024"
    volumes:
      - ./data:/app/data
      - ./evidence:/app/evidence
